<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rig</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('rig-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
          // Charter v2 palette experiment — same pre-paint mirror as the
          // theme, deleted (or promoted) when the palette decision lands.
          if (localStorage.getItem('rig-palette') === 'slate-lavender') {
            document.documentElement.setAttribute('data-palette', 'slate-lavender');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
